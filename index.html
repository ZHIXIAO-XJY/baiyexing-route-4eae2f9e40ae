<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>路线指引</title>
<!-- 上线后把 __BASE__ 换成根地址，微信分享卡片才会带缩略图 -->
<meta property="og:type" content="website">
<meta property="og:title" content="路线指引">
<meta property="og:description" content="5 步路线图，按图中橙色箭头方向行进">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#f2f3f5;color:#1f2329;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .topbar{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.94);
          backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
          border-bottom:1px solid #e5e6eb;
          padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .t{font-size:17px;font-weight:600;letter-spacing:.5px}
  .s{font-size:12px;color:#86909c;margin-top:2px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 10px 0}
  .card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card img{display:block;width:100%;height:auto}
  .foot{max-width:640px;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
        font-size:12px;color:#86909c;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="topbar">
  <div class="t">路线指引</div>
  <div class="s">向上滑动查看全部 5 步</div>
</div>
<div class="wrap"><div class="card">
<img src="./route.jpg" alt="路线指引长图">
</div></div>
<div class="foot">共 5 步 · 按图中橙色箭头方向行进<br>长按图片可保存到相册</div>
</body>
</html>
